[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcal"
version = "1.0.0"
description = "Rank-directed conformal calibration with finite-element response enclosures"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Cemil Emre Yavas", email = "cemil@fairesresearch.org"},
  {name = "Nancy R. Mead"},
  {name = "Lei Chen"}
]
dependencies = ["numpy==1.26.3", "scipy==1.11.4", "pandas==2.2.1", "scikit-learn==1.4.0", "scikit-fem==12.0.1"]

[project.optional-dependencies]
neural = ["torch==2.4.1"]

[tool.setuptools.packages.find]
where = ["src"]
